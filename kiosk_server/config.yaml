# Tells Home Assistant how to run the Kiosk server as an add-on.
name: Kiosk Signage Server
version: "0.7.0"
slug: kiosk_server
description: The server for the Kiosk Admin phone app and the Kiosk Player TV app.
url: https://github.com/hybrid87sg/kiosk-player
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The web interface in Home Assistant's sidebar, for Home Assistant admins.
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: Kiosk Signage
panel_admin: true
# Lets the add-on ask Home Assistant to send notifications (e.g. to your phone's
# Home Assistant app) when a screen goes offline.
homeassistant_api: true
# "Open web UI" button on the add-on's page, for the web interface on port 3000.
webui: "http://[HOST]:[PORT:3000]"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Kiosk server (the apps connect here)
# The add-on's own config folder. The Google key can be put here as a file; the
# easier way is the Settings page of the web interface (upload or paste).
map:
  - type: addon_config
    read_only: false
options:
  mode: main
  site_name: ""
  main_server_url: ""
  pairing_code: ""
  drive_folder_id: ""
  service_account_file: service-account.json
  cache_media: true
  transcode_videos: false
  transcode_4k_hevc: false
  transcode_threads: 1
schema:
  mode: list(main|relay)
  site_name: str?
  main_server_url: str?
  pairing_code: password?
  drive_folder_id: str?
  service_account_file: str?
  cache_media: bool
  transcode_videos: bool
  transcode_4k_hevc: bool
  transcode_threads: int(1,4)?
# Home Assistant downloads the add-on ready-made from here (the tag is the version above).
image: ghcr.io/hybrid87sg/kiosk-server
