configuration:
  mode:
    name: Mode
    description: "main: this Home Assistant is the control centre (the usual choice, and the only one if you have one site). relay: this Home Assistant is at another site; its TVs reach the main server through it."
  site_name:
    name: Site name
    description: The name of this site, e.g. Head office or Orchard branch. It is shown on this site's relay page and on new TVs waiting to be added.
  main_server_url:
    name: Main server address (relay only)
    description: The main Kiosk server's Tailscale address, e.g. 100.101.102.103:3000. Leave empty in main mode.
  pairing_code:
    name: Pairing code (relay only)
    description: "Make it on the main server: Settings → Home Assistant Relays. It works once and for 10 minutes; after pairing it can stay here or be removed. Leave empty in main mode."
  drive_folder_id:
    name: Google Drive folder ID
    description: The ID of the Signage folder, from its web address (drive.google.com/drive/folders/THIS-PART).
  service_account_file:
    name: Service account key file (optional)
    description: Only if you copied the key file into this add-on's config folder (in addon_configs, the folder ending in _kiosk_server). The easier way is to leave this alone and add the key in Kiosk Signage, under Settings → Google key.
  cache_media:
    name: Keep a local copy of each file
    description: Each file is downloaded from Google Drive once, then sent to every TV from this machine. Uses disk space here.
  transcode_videos:
    name: Make playback copies
    description: After a video arrives, make a 1080p H.264 copy and a 720p fallback so weak TV boxes can play it smoothly. The original in Google Drive is left as it is. Turn this off on a slow machine such as a Raspberry Pi if the add-on becomes unresponsive.
  transcode_4k_hevc:
    name: Also make a 4K HEVC copy
    description: Optional extra copy for a TV box that can decode HEVC and has a 4K screen. This is the slowest copy to make. Leave it off on a Raspberry Pi.
  transcode_threads:
    name: Encoder threads
    description: How many processor cores one copy may use. Leave this at 1 on a Raspberry Pi so Home Assistant stays responsive.
network:
  3000/tcp: Kiosk server port
